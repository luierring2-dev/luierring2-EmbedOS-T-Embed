; EmbedOS — custom firmware for LilyGO T-Embed CC1101 (Plus)
;
; Two build targets share one board/display config via the [env] base:
;   env:t-embed-cc1101  -> EmbedOS        (goes in the ota_0 slot)
;   env:launcher        -> the boot menu  (goes in the factory slot)
;
; Build both:  pio run
; See README for how to flash the multiboot layout.

[platformio]
default_envs = launcher, t-embed-cc1101
boards_dir = boards

; ---- shared base for every environment ----
[env]
platform = espressif32@6.13.0
board = lilygo-t-embed-cc1101
framework = arduino
board_build.partitions = partitions_multiboot.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    ; --- TFT_eSPI configuration (replaces User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; ---- EmbedOS (everything except the launcher folder) ----
[env:t-embed-cc1101]
build_src_filter = +<*> -<launcher/>
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    jgromes/RadioLib@7.7.1
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit PN532@1.3.4
    crankyoldgit/IRremoteESP8266@2.8.6

; ---- Boot launcher (only the launcher folder + the shared multiboot helper) ----
[env:launcher]
build_src_filter = -<*> +<launcher/> +<multiboot.cpp>
lib_deps =
    bodmer/TFT_eSPI@2.5.43
